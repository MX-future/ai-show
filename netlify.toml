[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Functions runtime Node 版本（@supabase/supabase-js@2.112 需要 Node 22+，否则报 native WebSocket not found）
  node_version = "22"

# API：统一由 api function 处理（内部按路径路由）
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# 已上传 dist 的静态代理
[[redirects]]
  from = "/sites/*"
  to = "/.netlify/functions/sites"
  status = 200
  force = true

# 上传的图片资源
[[redirects]]
  from = "/images/*"
  to = "/.netlify/functions/images"
  status = 200
  force = true

# 注意：不要加 `/* → /index.html` 的 SPA 兜底！
# 本站为 hash 路由（#/project/xxx），无需 fallback；
# 且 force=true 会强制把 assets/*.js 等静态文件也重定向成 index.html，
# 导致浏览器报 "MIME type of text/html" 错误。
